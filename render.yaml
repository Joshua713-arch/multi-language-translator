services:
  - type: web
    name: multi-language-translator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 100 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MYMEMORY_EMAIL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
