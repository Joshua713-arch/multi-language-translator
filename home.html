{% extends 'base.html' %}
{% block content %}
<form method="post" class="buttons">
  <h1>Multi-Language Translator</h1>
  <h3>Enter The Chat Room</h3>

  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}

  <div class="field">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Pick a name!" value="{{ name or '' }}" maxlength="40">
  </div>

  <div class="stack">
    <label for="language">Language:</label>
    <select id="language" name="language">
      {% for lang_name, lang_code in languages %}
      <option value="{{ lang_code }}" {% if lang_code == language %}selected{% endif %}>{{ lang_name | title }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="stack">
    <input type="text" name="code" placeholder="Room Code" value="{{ code or '' }}" maxlength="4" class="code-input">
  </div>

  <button type="submit" name="join" value="1" class="btn green wide">Join a Room</button>
  <button type="submit" name="create" value="1" class="btn green wide">Create a Room</button>
</form>
{% endblock %}
